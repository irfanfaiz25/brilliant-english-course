name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"
  # Server env is validated at startup. Jobs that need a database start a throwaway Postgres 17.
  DATABASE_URL: postgres://bec:bec@localhost:5432/bec
  # The design preview is exercised by E2E tests.
  ENABLE_DESIGN_PREVIEW: "true"

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-agent-docs.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    name: Migrations apply on a fresh database
    runs-on: ubuntu-latest
    # Throwaway database that only exists for this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bec
          POSTGRES_PASSWORD: bec
          POSTGRES_DB: bec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bec -d bec"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bec:bec@localhost:5432/bec
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - name: Schema is in sync with migrations
        run: pnpm exec drizzle-kit check
      - name: Region dataset imports and searches within budget
        run: pnpm db:regions

  build-e2e:
    name: Build and E2E
    needs: quality
    runs-on: ubuntu-latest
    # Throwaway database: seeded content for the build, E2E accounts from the global setup.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bec
          POSTGRES_PASSWORD: bec
          POSTGRES_DB: bec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bec -d bec"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway auth secret for this run
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      # Public pages are prerendered from the database at build time (ADR-026).
      - name: Regions and dev seed for the build and E2E
        run: pnpm db:regions && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
