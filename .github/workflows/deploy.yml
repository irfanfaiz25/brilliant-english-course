name: Deploy

# Production release (ADR-043, ADR-044, ADR-045): every merge into `staging` releases it. CI already
# passed on the pull request (branch protection), so it is not repeated here.
#
#   tools ──► migrate ──► app ──► release
#
# Migrations run on the server before the app image is built, because the build prerenders public
# pages from the production database and must see the new schema. They are additive, so the
# running release keeps working until the new one replaces it. Runbook: docs/DEPLOY.md.

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA on staging to deploy (default: the latest commit)"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/irfanfaiz25/bec
  TOOLS_IMAGE: ghcr.io/irfanfaiz25/bec-tools

jobs:
  tools:
    name: Tools image
    # Off until the server is configured. A repository variable: an environment's variables are
    # not visible to a job's `if` (docs/DEPLOY.md § 2).
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Release id
        id: release
        run: |
          sha="$(git rev-parse HEAD)"
          # Only commits on the release branch are deployed.
          git merge-base --is-ancestor "$sha" origin/staging || { echo "$sha is not on staging"; exit 1; }
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (migrations and one-off jobs)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.TOOLS_IMAGE }}:${{ steps.release.outputs.sha }}
            ${{ env.TOOLS_IMAGE }}:latest
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

  migrate:
    name: Migrate the database
    needs: tools
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key and known host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key only runs deploy.sh on the server (forced command): this sends its arguments.
      - name: Apply migrations of ${{ needs.tools.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@${{ vars.DEPLOY_HOST }}" "migrate ${{ needs.tools.outputs.sha }}"

  app:
    name: App image
    needs: [tools, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tools.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (prerendered from the production database)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.tools.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.NEXT_PUBLIC_MEDIA_URL }}
            SITE_INDEXING=${{ vars.SITE_INDEXING || 'false' }}
            APP_VERSION=${{ needs.tools.outputs.sha }}
          # Read-only database role: the build only reads published content.
          secrets: |
            database_url=${{ secrets.BUILD_DATABASE_URL }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  release:
    name: Release on the server
    needs: [tools, app]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: SSH key and known host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy ${{ needs.tools.outputs.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@${{ vars.DEPLOY_HOST }}" "deploy ${{ needs.tools.outputs.sha }}"

      - name: Check the public URL
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS --max-time 10 "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health" | grep -q '"version":"${{ needs.tools.outputs.sha }}"'; then
              echo "Live: ${{ needs.tools.outputs.sha }}"; exit 0
            fi
            sleep 6
          done
          echo "The public URL does not serve ${{ needs.tools.outputs.sha }} yet" >&2
          exit 1
