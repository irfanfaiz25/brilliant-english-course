allowBuilds:
  # Image optimization for next/image in production.
  sharp: true
  # Native resolver used by eslint-config-next.
  unrs-resolver: true
  # Bundler binary used by Vitest and drizzle-kit.
  esbuild: true
  # Optional native deps of the next-intl message extractor (unused).
  "@parcel/watcher": false
  "@swc/core": false
